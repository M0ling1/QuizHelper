<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一页多道大题、每题多个空</title>
<style>
  body { margin: 0; padding: 14px; font: 22px/1.8 sans-serif; background: #f6f6f6; }
  .q { background: #fff; padding: 16px; border-radius: 10px; margin-bottom: 14px; }
  input { width: 140px; font-size: 22px; padding: 6px; margin: 4px 8px 4px 0;
          border: 2px solid #bbb; border-radius: 6px; }
  .spacer { height: 100px; }
</style>
</head>
<body>

<div class="q">
  <p>1. 填空：中国的首都是____，最长的河流是____。</p>
  <p><input id="a"><input id="b"></p>
</div>

<div class="q">
  <p>2. 填空：1+1=____，3×3=____，10-4=____。</p>
  <p><input id="c"><input id="d"><input id="e"></p>
</div>

<div class="spacer"></div>

<div class="q">
  <p>3. 填空：水的化学式是____，二氧化碳的化学式是____。</p>
  <p><input id="f"><input id="g"></p>
</div>

</body>
</html>
